# render.yaml — Full Render.com deployment (Frontend + Backend)
# Docs: https://render.com/docs/render-yaml-spec

services:

  # ── 1. Python Flask Backend ───────────────────────────────
  - type: web
    name: cardioai-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: MODELS_DIR
        value: ./models
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 2. React + Vite Frontend (Static Site) ────────────────
  - type: web
    name: cardioai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://cardioai-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
