# render.yaml — Full Render.com deployment (Frontend + Backend)
# Docs: https://render.com/docs/render-yaml-spec
#
# HOW TO USE:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo → Render auto-reads this file
#   4. Both services deploy automatically
#
# After first deploy:
#   - Copy the cardioai-api URL (e.g. https://cardioai-api.onrender.com)
#   - Set VITE_API_BASE on the frontend service to that URL + /api
#   - Trigger a redeploy of the frontend

services:

  # ── 1. Python Flask Backend ───────────────────────────────
  - type: web
    name: cardioai-api
    runtime: python
    region: oregon           # pick closest to your users
    plan: free               # free tier — upgrade to avoid cold starts
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: MODELS_DIR
        value: ./models
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 2. React + Vite Frontend (Static Site) ────────────────
  - type: web
    name: cardioai-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        # After deploying the backend, paste its URL here + /api
        # e.g.  https://cardioai-api.onrender.com/api
        value: https://cardioai-api.onrender.com/api
    routes:
      # SPA catch-all — all paths serve index.html (React Router handles routing)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cache hashed assets forever, never cache index.html
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
